<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URBAN-CLEAN | Dashboard Lomé</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: "Times New Roman", serif; margin: 0; background: #f4f4f4; }
        header { background: #1b5e20; color: white; padding: 10px; text-align: center; }
        
        /* Ajustement Mobile : La carte d'abord, les stats en dessous */
        #main-container { display: flex; flex-direction: column; height: 100vh; }
        #map { height: 60%; width: 100%; border-bottom: 3px solid #1b5e20; }
        #sidebar { flex: 1; padding: 15px; overflow-y: auto; background: white; }

        .stat-card { background: #e8f5e9; padding: 10px; border-radius: 8px; border-left: 5px solid #1b5e20; margin-bottom: 10px; }
        .alert-item { background: #fff; border: 1px solid #ddd; padding: 10px; margin-bottom: 5px; border-radius: 4px; font-size: 0.9em; }
        h1 { font-size: 1.2em; margin: 0; }
        h2 { font-size: 1em; color: #1b5e20; }
    </style>
</head>
<body>

<div id="main-container">
    <header><h1>URBAN-CLEAN : Observatoire Lomé</h1></header>
    
    <div id="map"></div>

    <div id="sidebar">
        <div class="stat-card">
            <strong id="stats-count">0 zone(s) identifiée(s)</strong>
        </div>
        <h2>Signalements récents</h2>
        <div id="alert-list">Chargement des données SIG...</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC1jpzpQRyEAn5sP6ojhasBRwZAMt5L_p4",
      authDomain: "urbancleanlome.firebaseapp.com",
      projectId: "urbancleanlome",
      storageBucket: "urbancleanlome.firebasestorage.app",
      messagingSenderId: "196173923360",
      appId: "1:196173923360:web:5e3d6935c95d6c96822845"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Carte centrée sur Lomé
    var map = L.map('map').setView([6.1319, 1.2228], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    onSnapshot(collection(db, "signalements"), (snapshot) => {
        const list = document.getElementById('alert-list');
        const countDisplay = document.getElementById('stats-count');
        list.innerHTML = "";
        let count = 0;

        snapshot.forEach((doc) => {
            const d = doc.data();
            count++;
            
            // Correction du bug "undefined" : on vérifie les noms exacts des champs
            const lat = d.latitude || 0;
            const lng = d.longitude || 0;
            const desc = d.description || "Sans description";

            L.marker([lat, lng]).addTo(map).bindPopup(desc);

            const item = document.createElement('div');
            item.className = 'alert-item';
            item.innerHTML = `<b>#${count}</b> - ${desc}<br><small>📍 GPS: ${lat.toFixed(4)}, ${lng.toFixed(4)}</small>`;
            list.appendChild(item);
        });
        countDisplay.innerText = `${count} zone(s) identifiée(s) à Lomé`;
    });
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</body>
</html>
