<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>URBAN-CLEAN SIG | Lomé</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Segoe UI', serif; margin: 0; background: #f0f2f5; overflow: hidden; }
        #main-app { display: flex; flex-direction: column; height: 100vh; }
        header { background: #1b5e20; color: white; padding: 12px; text-align: center; font-weight: bold; z-index: 1000; }
        
        /* Conteneur de carte avec fond de secours */
        #map { flex: 1; width: 100%; background: #e0e0e0; position: relative; }

        #controls { padding: 15px; background: white; border-top: 3px solid #1b5e20; z-index: 1001; }
        .btn-signal { background: #d32f2f; color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 1em; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        
        .stat-bar { display: flex; justify-content: space-between; background: #e8f5e9; padding: 10px; border-radius: 5px; margin-top: 10px; border-left: 5px solid #1b5e20; }
        #alert-feed { max-height: 100px; overflow-y: auto; margin-top: 10px; font-size: 0.85em; border-top: 1px solid #eee; }
    </style>
</head>
<body>

<div id="main-app">
    <header>URBAN-CLEAN : Observatoire de Lomé</header>
    <div id="map"></div>
    <div id="controls">
        <button class="btn-signal" onclick="localiserEtSignaler()">🚨 SIGNALER UNE INSALUBRITÉ</button>
        <div class="stat-bar">
            <span>Points identifiés :</span>
            <strong id="counter">0</strong>
        </div>
        <div id="alert-feed">Chargement du flux...</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC1jpzpQRyEAn5sP6ojhasBRwZAMt5L_p4",
      authDomain: "urbancleanlome.firebaseapp.com",
      projectId: "urbancleanlome",
      storageBucket: "urbancleanlome.firebasestorage.app",
      messagingSenderId: "196173923360",
      appId: "1:196173923360:web:5e3d6935c95d6c96822845"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Initialisation robuste de la carte
    var map = L.map('map').setView([6.1319, 1.2228], 13);
    
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // ACTION CRUCIALE : Force le chargement des tuiles toutes les 200ms au début
    let fixCount = 0;
    const fixMap = setInterval(() => {
        map.invalidateSize();
        fixCount++;
        if (fixCount > 10) clearInterval(fixMap);
    }, 200);

    onSnapshot(collection(db, "signalements"), (snapshot) => {
        const feed = document.getElementById('alert-feed');
        const counter = document.getElementById('counter');
        feed.innerHTML = "";
        let count = 0;

        snapshot.forEach((doc) => {
            const data = doc.data();
            count++;
            
            // Sécurité contre le NaN : on force la conversion et on gère l'absence
            const lat = parseFloat(data.latitude) || 6.1319;
            const lng = parseFloat(data.longitude) || 1.2228;

            L.marker([lat, lng]).addTo(map);

            const div = document.createElement('div');
            div.style.padding = "5px";
            div.innerHTML = `📍 ${data.description || 'Alerte'} (${lat.toFixed(3)}, ${lng.toFixed(3)})`;
            feed.prepend(div);
        });
        counter.innerText = count;
    });

    window.localiserEtSignaler = function() {
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const desc = prompt("Type d'insalubrité :");
            if (!desc) return;
            await addDoc(collection(db, "signalements"), {
                description: desc,
                latitude: pos.coords.latitude,
                longitude: pos.coords.longitude,
                timestamp: serverTimestamp()
            });
        });
    }
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</body>
</html>
