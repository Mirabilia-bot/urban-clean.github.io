<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>URBAN-CLEAN | STRATOS SIG</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --nasa-blue: #0b3d91; --nasa-red: #fc3d21; --safety-green: #1b5e20; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Times New Roman', serif; overflow: hidden; background: #000; }
        
        #mission-control { display: flex; flex-direction: column; height: 100vh; background: #fff; }
        header { background: var(--safety-green); color: white; padding: 15px; text-align: center; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); z-index: 9999; }
        
        #map { flex: 1; width: 100%; height: 100%; background: #222; }

        #data-panel { 
            height: 40vh; background: #ffffff; border-top: 5px solid var(--safety-green); 
            display: flex; flex-direction: column; z-index: 9999; padding: 15px; box-sizing: border-box;
        }

        .btn-launch { 
            background: var(--nasa-red); color: white; border: none; padding: 18px; 
            border-radius: 12px; font-weight: bold; font-size: 1.1rem; width: 100%;
            box-shadow: 0 6px 20px rgba(252, 61, 33, 0.4); cursor: pointer;
        }

        #telemetry-feed { flex: 1; overflow-y: auto; margin-top: 15px; border: 1px solid #ddd; border-radius: 10px; background: #f9f9f9; }
        .log-entry { 
            display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #eee; 
            font-size: 0.9rem; border-left: 5px solid var(--safety-green); margin: 5px; background: white;
        }
        .admin-tools { display: flex; gap: 15px; }
        .stat-hub { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; color: var(--safety-green); }
    </style>
</head>
<body>

<div id="mission-control">
    <header>Urban-Clean : Observatoire Lomé (V.NASA)</header>
    <div id="map"></div>
    <div id="data-panel">
        <div class="stat-hub">
            <span>STATUT : OPÉRATIONNEL</span>
            <span>ALERTES : <span id="count-hex">0</span></span>
        </div>
        <button class="btn-launch" onclick="initiateSignal()">🚨 SIGNALER UNE ANOMALIE</button>
        <div id="telemetry-feed"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC1jpzpQRyEAn5sP6ojhasBRwZAMt5L_p4",
      authDomain: "urbancleanlome.firebaseapp.com",
      projectId: "urbancleanlome",
      storageBucket: "urbancleanlome.firebasestorage.app",
      messagingSenderId: "196173923360",
      appId: "1:196173923360:web:5e3d6935c95d6c96822845"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const uID = localStorage.getItem('nasa_id') || 'NASA-' + Math.random().toString(36).toUpperCase().substr(2, 6);
    localStorage.setItem('nasa_id', uID);

    // Initialisation robuste de la carte
    let map;
    function bootMap() {
        if (map) map.remove();
        map = L.map('map', { zoomControl: false, fadeAnimation: false }).setView([6.1319, 1.2228], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: 'SIG NASA/OSM' }).addTo(map);
        
        // Force le rendu immédiat
        setTimeout(() => map.invalidateSize(), 500);
    }
    bootMap();

    const markers = {};
    onSnapshot(collection(db, "signalements"), (snap) => {
        const feed = document.getElementById('telemetry-feed');
        const count = document.getElementById('count-hex');
        feed.innerHTML = "";
        let total = 0;

        snap.forEach((sDoc) => {
            const d = sDoc.data();
            const id = sDoc.id;
            if (d.latitude && d.longitude) {
                total++;
                if (!markers[id]) {
                    markers[id] = L.marker([d.latitude, d.longitude]).addTo(map).bindPopup(d.description);
                }

                const entry = document.createElement('div');
                entry.className = 'log-entry';
                const isMine = (d.userId === uID);
                entry.innerHTML = `
                    <div><strong>${d.description}</strong><br><small>LAT: ${d.latitude.toFixed(4)} | LON: ${d.longitude.toFixed(4)}</small></div>
                    <div class="admin-tools">
                        ${isMine ? `<i class="fas fa-trash" style="color:var(--nasa-red)" onclick="abort('${id}')"></i>` : ''}
                    </div>`;
                feed.prepend(entry);
            }
        });
        count.innerText = total;
        map.invalidateSize();
    });

    window.initiateSignal = () => {
        navigator.geolocation.getCurrentPosition(async (p) => {
            const msg = prompt("DESCRIPTION DE L'INSALUBRITÉ :");
            if (!msg) return;
            await addDoc(collection(db, "signalements"), {
                description: msg, latitude: p.coords.latitude, longitude: p.coords.longitude,
                userId: uID, timestamp: serverTimestamp()
            });
        }, () => alert("GPS REQUIS"), { enableHighAccuracy: true });
    };

    window.abort = async (id) => {
        if (confirm("CONFIRMER LA SUPPRESSION DU SIGNALEMENT ?")) {
            await deleteDoc(doc(db, "signalements", id));
        }
    };
</script>
</body>
</html>
