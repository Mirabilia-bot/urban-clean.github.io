<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>URBAN-CLEAN | GEOPORTAIL LOMÉ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Times New Roman', serif; }
        #map { height: 60vh; width: 100%; background: #ccc; }
        #panel { height: 40vh; background: white; border-top: 4px solid #1b5e20; padding: 15px; box-sizing: border-box; overflow-y: auto; }
        .header { background: #1b5e20; color: white; padding: 10px; text-align: center; font-weight: bold; }
        .btn { background: #fc3d21; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; margin-bottom: 10px; }
        .item { padding: 10px; border-bottom: 1px solid #eee; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="header">URBAN-CLEAN : EXPERT SIG GNIMDOU</div>
    <div id="map"></div>
    <div id="panel">
        <button class="btn" onclick="signalerAction()">📍 SIGNALER UNE ANOMALIE</button>
        <div id="logs">Chargement des données satellites...</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <script>
        // Configuration identique à votre projet
        const firebaseConfig = {
            apiKey: "AIzaSyC1jpzpQRyEAn5sP6ojhasBRwZAMt5L_p4",
            authDomain: "urbancleanlome.firebaseapp.com",
            projectId: "urbancleanlome",
            appId: "1:196173923360:web:5e3d6935c95d6c96822845"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Initialisation Carte (Standard Géoportail)
        var map = L.map('map').setView([6.1319, 1.2228], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Synchronisation Temps Réel
        db.collection("signalements").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
            const logs = document.getElementById('logs');
            logs.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                if(data.latitude && data.longitude) {
                    L.marker([data.latitude, data.longitude]).addTo(map).bindPopup(data.description);
                    logs.innerHTML += `<div class="item"><strong>${data.description}</strong><br>GPS: ${data.latitude.toFixed(4)}, ${data.longitude.toFixed(4)}</div>`;
                }
            });
        });

        function signalerAction() {
            const desc = prompt("Nature de l'insalubrité :");
            if(!desc) return;
            
            navigator.geolocation.getCurrentPosition((pos) => {
                db.collection("signalements").add({
                    description: desc,
                    latitude: pos.coords.latitude,
                    longitude: pos.coords.longitude,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            }, () => {
                alert("GPS bloqué. Utilisation de la position par défaut (Lomé Centre).");
                db.collection("signalements").add({
                    description: desc + " (Position approx.)",
                    latitude: 6.1319,
                    longitude: 1.2228,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            });
        }
        
        // Correction forcée de la taille de la carte
        setTimeout(() => { map.invalidateSize(); }, 1000);
    </script>
</body>
</html>
